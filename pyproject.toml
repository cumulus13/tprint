[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "trprint"
version = "1.0.4"
description = "Custom traceback printer"
readme = "README.md"
authors = [
    { name = "Hadi Cahyadi" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Console Fonts",
]
requires-python = ">=3.8"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/cumulus13/tprint"
Repository = "https://github.com/cumulus13/tprint"
